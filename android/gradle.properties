# Limites para manter o desenvolvimento responsivo em notebooks com 16 GB de RAM.
# Idioma fixo permite reutilizar o mesmo daemon no terminal e no VS Code.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.language=pt -Duser.country=BR -Duser.variant=
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.priority=low
# Libera os processos de compilação após dois minutos sem builds.
org.gradle.daemon.idletimeout=120000
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
